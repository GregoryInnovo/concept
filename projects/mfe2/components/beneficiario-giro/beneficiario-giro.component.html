<div class="beneficiario-container">
  <!-- Información del cliente y giro -->
  <div class="info-section">
    <div class="info-row">
      <div class="info-group">
        <label>TIPO DOCUMENTO</label>
        <div class="info-value">{{clienteData.tipoDocumento}}</div>
      </div>
      <div class="info-group">
        <label>NÚMERO DOCUMENTO</label>
        <div class="info-value">{{clienteData.numeroDocumento}}</div>
      </div>
    </div>

    <div class="info-row">
      <div class="info-group">
        <label>NOMBRE CLIENTE</label>
        <div class="info-value">{{clienteData.nombreCliente}}</div>
      </div>
    </div>

    <div class="info-row">
      <div class="info-group">
        <label>TELÉFONO</label>
        <div class="info-value">{{clienteData.telefono}}</div>
      </div>
      <div class="info-group">
        <label>MAIL</label>
        <div class="info-value">{{clienteData.email}}</div>
      </div>
    </div>

    <div class="info-row">
      <div class="info-group">
        <label>VALOR TOTAL DEL GIRO</label>
        <div class="info-value">$ {{clienteData.valorTotalGiro}}</div>
      </div>
      <div class="info-group">
        <label>CUENTA ORIGEN</label>
        <div class="info-value">{{clienteData.cuentaOrigen}}</div>
      </div>
    </div>
  </div>

  <!-- Formulario del beneficiario -->
  <div class="beneficiario-section">
    <h3 class="section-title">DATOS DEL BENEFICIARIO</h3>
    
    <div class="form-group">
      <label for="tipoDoc">TIPO DOCUMENTO</label>
      <select 
        id="tipoDoc" 
        [(ngModel)]="beneficiarioData.tipoDocumento" 
        class="form-control">
        @for (tipo of tiposDocumento; track tipo) {
          <option [value]="tipo">{{tipo}}</option>
        }
      </select>
    </div>

    <div class="form-group">
      <label for="numDoc">NÚMERO DOCUMENTO</label>
      <input 
        type="text" 
        id="numDoc" 
        [(ngModel)]="beneficiarioData.numeroDocumento" 
        class="form-control"
        placeholder="Ingrese número de documento">
    </div>

    <div class="form-group">
      <label for="nombre">NOMBRE CLIENTE</label>
      <input 
        type="text" 
        id="nombre" 
        [(ngModel)]="beneficiarioData.nombreCliente" 
        class="form-control"
        placeholder="Ingrese nombre del beneficiario">
    </div>
  </div>

  <!-- Botón de emitir -->
  <div class="button-section">
    <button class="btn-emitir" (click)="emitir()">EMITIR</button>
  </div>
</div>

@if (showComprobante) {
  <app-comprobante-giro (cerrarComprobante)="onCerrarComprobante()" />
}
